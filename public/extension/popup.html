<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Omnia Companion</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .logo {
      font-size: 22px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .label {
      font-size: 12px;
      font-weight: 600;
    }
    .desc {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .status {
      font-size: 11px;
      text-align: center;
      color: #10b981;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🦉</div>
    <div>
      <div class="title">Omnia Study Companion</div>
      <div class="subtitle">Focus Shield & Web Clipper</div>
    </div>
  </div>

  <div class="card">
    <div class="switch-row">
      <div>
        <div class="label">Bloqueador de Redes</div>
        <div class="desc">Trava YouTube, Instagram e TikTok</div>
      </div>
      <input type="checkbox" id="blockerToggle" style="width: 18px; height: 18px; accent-color: #0284c7;">
    </div>
  </div>

  <button class="btn btn-primary" id="clipBtn">
    <span>📎 Capturar Página para o Omnia</span>
  </button>
  <div class="status" id="statusMsg">Enviado para a Inbox!</div>

  <button class="btn btn-secondary" id="openOmniaBtn">
    <span>🚀 Abrir Aplicativo Omnia</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
